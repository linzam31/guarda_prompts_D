<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de prompts</title>
    <link rel="stylesheet" href="./static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    
    <form method="POST" action="{{ url_for('guardar_prompt')}}">
        <h1>Tu Asistente para gestionar prompts</h1>
        <div class="container">
            <label for="prompts">Agrega un prompt</label>
            <textarea id="prompt" name="prompts" placeholder="Escribe tu prompt..."></textarea>
            <button type="submit">Guardar</button>
        </div>
    </form>

    <h2>Prompts que has guardado:</h2>
    <div class="container-p">
        <ul>
            {% for prompt in prompts %}
                <li>{{ prompt[0] }}</li>
            {% endfor %}
        </ul>
            
    </div>
    
</body>

</html>
